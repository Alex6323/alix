<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>alix kids</title>
<!-- The kids page is a self-contained thin client with its own design system
     (Baloo 2 + warm accent themes), so it deliberately does NOT pull in the
     adult shared head (`theme.css` / IBM Plex). Only the brand mark component
     is reused, for the loading splash. -->
<script defer src="/alix-logo.js"></script>
<link rel="stylesheet" href="/kids.css">
</head>
<body>
<div id="app">
  <header class="appbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="wordmark">alix</span>
    </div>
    <button id="menuBtn" class="menu-btn" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false">☰</button>
  </header>

  <div class="stage-wrap">
    <main id="stage" class="stage" role="main"></main>
    <div id="fadeTop" class="fade fade-top" aria-hidden="true"></div>
    <div id="fadeBot" class="fade fade-bot" aria-hidden="true">▾ more</div>
  </div>

  <footer id="actionbar" class="actionbar"></footer>

  <!-- Loud failure. A request that dies (or a promise nobody caught) says so,
       instead of leaving a button that silently does nothing. Tap to dismiss. -->
  <button id="oops" class="oops" type="button" hidden aria-live="polite"></button>

  <div id="menuBackdrop" class="menu-backdrop" hidden></div>
  <div id="menuPop" class="menu-pop" hidden role="menu" aria-label="Colours">
    <div class="menu-title">Colours</div>
    <div class="themes" id="themes"></div>
  </div>

  <div id="tokengate" class="gate" hidden>
    <div class="gate-card">
      <div class="gate-title">Almost there!</div>
      <p>Ask a grown-up for the code alix showed, then pop it in here.</p>
      <input id="gateInput" class="gate-input" placeholder="paste the code" autocomplete="off" spellcheck="false">
      <button id="gateBtn" class="cta-btn" type="button">Let's go</button>
    </div>
  </div>

  <div id="askOverlay" class="ask-overlay" hidden role="dialog" aria-modal="true" aria-label="Ask Alix">
    <div class="ask-panel">
      <div class="ask-head">
        <div id="askMascotSlot"></div>
        <div class="ask-title">Ask Alix</div>
        <button id="askCloseBtn" class="ask-close-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div id="askLog" class="ask-log" aria-live="polite"></div>
      <div class="ask-footer">
        <div class="ask-input-row">
          <input id="askInput" class="ask-input-field" placeholder="Ask Alix anything…" autocomplete="off" spellcheck="false">
          <button id="askSendBtn" class="ask-send-btn" type="button">Send</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/kids.js"></script>
</body>
</html>
