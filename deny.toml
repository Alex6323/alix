[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "getrandom@0.2.17", reason = "directories still requires the older family" },
    { crate = "getrandom@0.3.4", reason = "rand 0.9 has not moved to getrandom 0.4" },
    { crate = "hashbrown@0.16.1", reason = "yaml-rust2 and indexmap use different families" },
    { crate = "r-efi@5.3.0", reason = "the accepted getrandom families require both r-efi versions" },
    { crate = "rand@0.8.7", reason = "ratex uses the rand 0.8 phf family" },
    { crate = "rand_core@0.6.4", reason = "ratex uses the rand 0.8 core family" },
    { crate = "roxmltree@0.20.0", reason = "fontconfig-parser has not moved to roxmltree 0.21" },
    { crate = "thiserror@1.0.69", reason = "ratex still uses thiserror 1" },
    { crate = "thiserror-impl@1.0.69", reason = "ratex still uses thiserror 1" },
    { crate = "wit-bindgen@0.51.0", reason = "the accepted getrandom families reach two WASI generations" },
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "deny"
unused-license-exception = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
exceptions = [
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[[licenses.clarify]]
crate = "rs-fsrs@1.2.1"
expression = "MIT"
license-files = [
    { path = "LICENSE", hash = 0x260b1e30 },
]
