[project]
name = "alix-dual-agent-orchestrator"
version = "0.1.0"
description = "Differential development research orchestrator for Claude Code and Codex"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
orchestrate = "orchestrator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=1.17,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
prompts = "orchestrator/prompts"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
