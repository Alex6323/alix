name: release

# Cut a release: on a version tag (e.g. v0.1.0), create the GitHub Release, then
# cross-compile `alix` for each target and upload the archives to it. The asset
# names match the download buttons on alix.study AND site/install.sh:
#   alix-aarch64-apple-darwin.tar.gz   alix-x86_64-apple-darwin.tar.gz
#   alix-x86_64-unknown-linux-gnu.tar.gz   alix-x86_64-pc-windows-msvc.zip
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release and upload its assets

jobs:
  # upload-rust-binary-action only uploads to an EXISTING release, so create the
  # release first (one job), then fan out the per-target builds + uploads to it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin,     os: macos-latest }
          # Build the Intel binary on the arm runner too (cross-compile): GitHub's
          # Intel `macos-13` runners are being wound down and queue for hours, while
          # `macos-latest` (arm64) is plentiful and builds x86_64 fine via the added
          # target. Keeps both macOS assets reliable.
          - { target: x86_64-apple-darwin,      os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc,   os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      # Builds, archives (.tar.gz / .zip on Windows), and uploads to the release
      # that create-release made for the pushed tag.
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: alix
          target: ${{ matrix.target }}
          locked: true
          archive: alix-$target
          include: LICENSE-MIT,LICENSE-APACHE,README.md
          # A .sha256 beside every archive, so a download is verifiable with
          # `sha256sum -c` (RELEASING.md documents the check).
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
