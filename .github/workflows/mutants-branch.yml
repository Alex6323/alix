name: Mutation branch gate

# Mutates a branch's own diff against main: hundreds of mutants, each a build
# plus a test run.
#
# The nightly and rotation workflows cover merged work and the standing tree;
# this covers a branch before it merges, so a miss surfaces while the change
# is still in hand.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      shards:
        description: "How many shards to split the diff across (1-64)"
        required: false
        default: "4"

permissions:
  contents: read

jobs:
  plan:
    name: plan mutation shards
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.shards.outputs.count }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the requested shard count
        id: shards
        env:
          REQUESTED_SHARDS: ${{ inputs.shards }}
        run: python3 scripts/mutants_branch_plan.py "$REQUESTED_SHARDS" >> "$GITHUB_OUTPUT"

  mutants:
    name: mutants ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
    needs: plan
    runs-on: ubuntu-latest
    # Under the 6h hard limit, so an unusually large branch fails cleanly on
    # time instead of being killed mid-run with no summary.
    timeout-minutes: 330
    strategy:
      # Every shard reports its own misses; stopping at the first red would
      # hide the rest of the branch's.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `make mutants` diffs against the merge-base, which a shallow clone
          # cannot resolve.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Mutate this shard of the branch diff
        run: |
          make mutants \
            MUTANTS_BASE=$(git merge-base origin/main HEAD) \
            MUTANTS_SHARD=${{ matrix.shard }}/${{ needs.plan.outputs.count }} \
            GATE_JOBS=4

      - name: Keep the outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-branch-${{ github.ref_name }}-shard${{ matrix.shard }}-of-${{ needs.plan.outputs.count }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
