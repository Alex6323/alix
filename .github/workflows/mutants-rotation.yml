name: Mutation rotation

# The nightly diff run only ever mutates what just merged, so everything older
# than that job has never been mutated at all. This one grinds through the
# whole tree instead: four parallel thirty-sixths per night, advancing by a
# monotonic UTC day index, so the codebase is covered on a rolling nine-day
# cycle and re-covered as it changes.
#
# The four shards come from the UTC day index, so there is no state to keep and
# no discontinuity at New Year. A missed night means those slices wait a cycle.
#
# Misses, mutant timeouts, and overruns fail the job; the summary and
# artifact still upload either way.
on:
  schedule:
    # 02:47 UTC, clear of the 03:17 drift job and the 04:23 diff nightly.
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "One physical shard to run instead of today's four (0-35)"
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: plan rotation shards
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.shards.outputs.count }}
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick tonight's shards
        id: shards
        env:
          REQUESTED_SHARD: ${{ inputs.shard }}
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          python3 scripts/mutants_rotation_plan.py "$day" "$REQUESTED_SHARD" >> "$GITHUB_OUTPUT"

  sweep:
    name: mutation rotation ${{ matrix.shard }}/${{ needs.plan.outputs.count }}
    needs: plan
    runs-on: ubuntu-latest
    # Under GitHub's 6h ceiling. A killed job yields nothing at all, so the
    # slice size is chosen to leave room rather than to fill the budget.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Mutate this slice of the tree
        id: sweep
        run: |
          started=$(date -u +%s)
          set +e
          # `timeout` rather than the job's own limit: a job killed by GitHub
          # skips every remaining step, including the report and the artifact,
          # so an overrun would destroy exactly the measurement this run exists
          # to produce. Overrunning here ends the STEP (124) and the rest runs.
          timeout 300m make mutants MUTANTS_ALL=1 MUTANTS_SHARD=${{ matrix.shard }}/${{ needs.plan.outputs.count }} GATE_JOBS=4
          status=$?
          set -e
          [ "$status" -eq 124 ] && echo "OVERRAN the 300m step budget" >> "$GITHUB_STEP_SUMMARY"
          echo "elapsed=$(( $(date -u +%s) - started ))" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The point of the run: how long a slice actually takes, so SHARDS can be
      # retuned from measurement instead of estimation.
      - name: Report
        if: always()
        run: |
          elapsed=${{ steps.sweep.outputs.elapsed || 0 }}
          count() { [ -f "mutants.out/$1" ] && wc -l < "mutants.out/$1" | tr -d ' ' || echo 0; }
          {
            echo "## Mutation rotation: shard ${{ matrix.shard }}/${{ needs.plan.outputs.count }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| wall clock | $((elapsed / 60))m $((elapsed % 60))s |"
            echo "| step budget | 300m |"
            echo "| exit | ${{ steps.sweep.outputs.status || 'n/a' }} (124 = overran) |"
            echo "| caught | $(count caught.txt) |"
            echo "| missed | $(count missed.txt) |"
            echo "| timeout | $(count timeout.txt) |"
            echo "| unviable | $(count unviable.txt) |"
            echo
            echo "Retune \`SHARDS\` from the SLOWEST slice, not the average:"
            echo "slices are contiguous file ranges, so a server-heavy one costs"
            echo "far more per mutant than a pure-function one."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "shard ${{ matrix.shard }}/${{ needs.plan.outputs.count }} took ${elapsed}s"

      - name: Keep the outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-rotation-shard-${{ matrix.shard }}-of-${{ needs.plan.outputs.count }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail on findings
        run: |
          status="${{ steps.sweep.outputs.status }}"
          if [ "$status" != "0" ]; then
            echo "sweep exited $status (missed mutants, mutant timeouts, or a 124 step overrun): failing the run"
            exit 1
          fi
