name: Mutation rotation

# The nightly diff run only ever mutates what just merged, so everything older
# than that job has never been mutated at all. This one grinds through the
# whole tree instead: one seventh per night, advancing by date, so the
# codebase is covered on a rolling one-week cycle and re-covered as it changes.
#
# The shard comes from the day of the year, so there is no state to keep and
# nothing to drift. A missed night just means that slice waits a cycle.
#
# Deliberately NOT a gate. Most of this code has never been mutated, so the
# first cycles will surface a large backlog; a job that goes red every night is
# one you stop reading. Findings land in the summary and the artifact, and the
# run itself stays green unless the tooling breaks.
on:
  schedule:
    # 02:47 UTC, clear of the 03:17 drift job and the 04:23 diff nightly.
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "Shard index to run instead of today's (0-6)"
        required: false

permissions:
  contents: read

env:
  SHARDS: 7

jobs:
  sweep:
    name: mutation rotation
    runs-on: ubuntu-latest
    # Under GitHub's 6h ceiling. A killed job yields nothing at all, so the
    # slice size is chosen to leave room rather than to fill the budget.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-mutants,cargo-nextest

      - name: Pick today's shard
        id: pick
        run: |
          shard="${{ inputs.shard }}"
          if [ -z "$shard" ]; then
            shard=$(( $(date -u +%j) % ${SHARDS} ))
          fi
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          echo "sweeping shard $shard/${SHARDS} of the whole tree"

      - name: Mutate this slice of the tree
        id: sweep
        continue-on-error: true
        run: |
          started=$(date -u +%s)
          set +e
          # `timeout` rather than the job's own limit: a job killed by GitHub
          # skips every remaining step, including the report and the artifact,
          # so an overrun would destroy exactly the measurement this run exists
          # to produce. Overrunning here ends the STEP (124) and the rest runs.
          timeout 300m make mutants MUTANTS_ALL=1 MUTANTS_SHARD=${{ steps.pick.outputs.shard }}/${SHARDS} GATE_JOBS=4
          status=$?
          set -e
          [ "$status" -eq 124 ] && echo "OVERRAN the 300m step budget" >> "$GITHUB_STEP_SUMMARY"
          echo "elapsed=$(( $(date -u +%s) - started ))" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The point of the run: how long a slice actually takes, so SHARDS can be
      # retuned from measurement instead of estimation.
      - name: Report
        if: always()
        run: |
          elapsed=${{ steps.sweep.outputs.elapsed || 0 }}
          count() { [ -f "mutants.out/$1" ] && wc -l < "mutants.out/$1" | tr -d ' ' || echo 0; }
          {
            echo "## Mutation rotation: shard ${{ steps.pick.outputs.shard }}/${SHARDS}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| wall clock | $((elapsed / 60))m $((elapsed % 60))s |"
            echo "| step budget | 300m |"
            echo "| exit | ${{ steps.sweep.outputs.status || 'n/a' }} (124 = overran) |"
            echo "| caught | $(count caught.txt) |"
            echo "| missed | $(count missed.txt) |"
            echo "| timeout | $(count timeout.txt) |"
            echo "| unviable | $(count unviable.txt) |"
            echo
            echo "Retune \`SHARDS\` from the SLOWEST slice, not the average:"
            echo "slices are contiguous file ranges, so a server-heavy one costs"
            echo "far more per mutant than a pure-function one."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "shard ${{ steps.pick.outputs.shard }}/${SHARDS} took ${elapsed}s"

      - name: Keep the outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-rotation-shard-${{ steps.pick.outputs.shard }}
          path: mutants.out/
          retention-days: 14
          if-no-files-found: ignore
