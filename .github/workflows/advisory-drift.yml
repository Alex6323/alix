name: Advisory drift

# Nightly RustSec advisory scan over the exact lockfile. Advisories change
# while the code stands still, so this is a scheduled drift probe rather than
# a push gate: a red run here means the WORLD moved (a dependency gained an
# advisory), not that a commit broke something. RELEASING.md makes a clean
# run a blocking release step, which is where the policy bites.
on:
  schedule:
    # 03:47 UTC, staggered clear of the other drift jobs.
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-audit

      # Both lockfiles: the published crate's and the mobile bridge's, with the
      # same denied categories as `make audit`, so a red here is what the
      # release gate will say.
      - run: cargo audit --deny unsound --deny yanked
      - run: cargo audit --file mobile/alix/rust/Cargo.lock --deny unsound --deny yanked
