name: Mobile release

# A signed arm64 release APK on GitHub Releases, driven by mobile-vX.Y.Z
# tags. The mobile app versions independently of the crate (whose pipeline
# listens to v* tags, a disjoint pattern), so an app hotfix never forces a
# crate release and vice versa. Process + one-time keystore setup:
# RELEASING.md, "The mobile app".
on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

jobs:
  # Re-run every blocking CI job on the tag's exact source SHA before any
  # signing secret is materialized or a public release can be created.
  exact-tag-ci:
    name: exact tag CI
    uses: ./.github/workflows/ci.yml
    with:
      release_gate: true
    permissions:
      contents: read

  release:
    needs: exact-tag-ci
    name: signed arm64 apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The tag must state the truth: mobile-vX.Y.Z == pubspec `version:
      # X.Y.Z+N`, with the +N build number present (N is the monotonic
      # versionCode Android orders installs by; it never resets).
      - name: Check the tag against pubspec
        run: |
          tag="${GITHUB_REF_NAME#mobile-v}"
          pub=$(sed -n 's/^version: //p' mobile/alix/pubspec.yaml)
          name="${pub%+*}"
          build="${pub#*+}"
          echo "tag $tag / pubspec $pub"
          if [ -z "$build" ] || [ "$build" = "$pub" ]; then
            echo "pubspec version carries no +N build number"; exit 1
          fi
          if [ "$tag" != "$name" ]; then
            echo "tag mobile-v$tag does not match pubspec $name"; exit 1
          fi
          echo "MOBILE_VERSION=$tag" >> "$GITHUB_ENV"

      # Release builds use the repository's exact Flutter, Rust, Java, codegen,
      # and NDK pins. mobile-drift.yml separately probes current stable tools.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: mobile/alix/.fvmrc
          cache: true

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21.0.11+10"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            .
            mobile/alix/rust

      - name: Install the pinned flutter_rust_bridge_codegen
        run: cargo install --locked --version 2.12.0 flutter_rust_bridge_codegen

      - name: Install the app-pinned NDK
        run: |
          gradle="mobile/alix/android/app/build.gradle.kts"
          ndk=$(sed -n 's/^[[:space:]]*ndkVersion = "\([0-9][0-9.]*\)"$/\1/p' "$gradle")
          echo "app pins NDK $ndk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"

      - run: make frb-check

      # The keystore, from secrets (one-time setup in RELEASING.md).
      # key.properties is gitignored; storeFile resolves relative to
      # android/app.
      - name: Materialize the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/alix/android/app/alix-release.jks
          {
            echo "storeFile=alix-release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > mobile/alix/android/key.properties

      # ONE arm64 APK, no --split-per-abi: the split offsets versionCode
      # per ABI, which would poison the monotonic scheme for zero benefit
      # when only aarch64 is built anyway.
      - name: Build the signed release APK (arm64)
        run: cd mobile/alix && flutter build apk --release --target-platform android-arm64

      # Missing secrets would silently fall back to debug signing (the
      # local-build convenience); a published debug-signed APK is worse
      # than a failed run.
      - name: Assert the APK is not debug-signed
        run: |
          cert=$(keytool -printcert -jarfile mobile/alix/build/app/outputs/flutter-apk/app-release.apk)
          echo "$cert" | head -3
          if echo "$cert" | grep -q "CN=Android Debug"; then
            echo "the APK is debug-signed; are the signing secrets set?"; exit 1
          fi

      # Android 15 requires 16KB-aligned native libs; NDK r28 emits them by
      # default, and this guard fails loud if the toolchain regresses.
      - name: Assert 16KB page alignment
        run: |
          unzip -o -q mobile/alix/build/app/outputs/flutter-apk/app-release.apk 'lib/arm64-v8a/*' -d /tmp/apk
          # -W (wide) keeps each program header on ONE line; without it readelf
          # wraps LOAD onto two lines and `$NF` grabs PhysAddr (0x0), not Align.
          align=$(readelf -lW /tmp/apk/lib/arm64-v8a/librust_lib_alix_mobile.so | awk '/LOAD/ {print $NF; exit}')
          echo "librust_lib_alix_mobile.so LOAD align: $align"
          case "$align" in
            0x4000|0x10000) ;;
            *) echo "not 16KB-aligned"; exit 1 ;;
          esac

      # Release notes are this version's section of the mobile changelog;
      # an empty section fails rather than shipping a blank release.
      - name: Extract the release notes
        run: |
          awk -v ver="$MOBILE_VERSION" \
            '$0 ~ "^## \\[" ver "\\]" {on=1; next} /^## \[/ {on=0} on' \
            mobile/alix/CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "no [$MOBILE_VERSION] section in mobile/alix/CHANGELOG.md"; exit 1
          fi
          cat /tmp/notes.md

      - name: Name the artifact
        run: cp mobile/alix/build/app/outputs/flutter-apk/app-release.apk alix-arm64-v8a.apk

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: alix mobile v${{ env.MOBILE_VERSION }}
          body_path: /tmp/notes.md
          files: alix-arm64-v8a.apk
          # `/releases/latest` is what the install script and the README's
          # headline command resolve, and it is repo-wide: an APK release
          # taking that slot points every desktop install at a release with
          # no desktop assets.
          make_latest: false
