name: Mobile toolchain-drift build

# Scheduled drift detector for the frb mobile toolchain: `make frb-check`
# first (so a failure names the drifted invariant), then a real end-to-end
# APK build of mobile/alix against the CURRENT stable Flutter. This is the
# only layer that proves the whole matrix (Flutter x frb x Gradle x AGP x
# NDK x our two template patches) still assembles; the bring-up hit two such
# breaks (Gradle 9 removed Project.exec(), compileSdk 33 too old) that only
# a build can surface. Never a PR gate: a red run is an alert that the
# toolchain moved, not a verdict on anyone's change.
on:
  schedule:
    # Weekly (Mondays 05:17 UTC), not nightly: drift arrives with toolchain
    # releases, not with days, and this job is ~15 runner-minutes.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: frb-check + apk build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Current STABLE Flutter, deliberately unpinned: meeting the newest
      # Flutter early is the point of this job.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      # The Rust side of the build: cargokit cross-compiles the core for the
      # one ABI we build below. Current stable is intentional in this drift job.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            .
            mobile/alix/rust

      # Codegen stays at the exact project version, so this job does not drift a
      # second compatibility dimension. toolchain-check keeps this copy aligned
      # with the Dart and Rust pins.
      - name: Install the pinned flutter_rust_bridge_codegen
        run: cargo install --locked --version 2.12.0 flutter_rust_bridge_codegen

      # In this disposable checkout, replace the release NDK pin with current
      # Flutter's NDK. That preserves an exact production pin while this one
      # workflow still probes the moving Flutter x NDK boundary.
      - name: Select and install current Flutter's NDK
        run: |
          ext="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"
          ndk=$(sed -n 's/.*val ndkVersion: String = "\([0-9][0-9.]*\)".*/\1/p' "$ext")
          echo "flutter pins NDK $ndk"
          sed -i 's/ndkVersion = "[0-9.]*"/ndkVersion = "'"$ndk"'"/' \
            mobile/alix/android/app/build.gradle.kts
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk"

      # The cheap invariant pass: on drift this fails with the invariant's
      # name, which beats the Gradle stacktrace the build below would give.
      - run: make frb-check

      # The proof: the whole toolchain still assembles our patched project.
      # Debug build, one ABI: signing and per-ABI fanout add nothing to
      # drift detection.
      - name: Build the app (debug, arm64)
        run: cd mobile/alix && flutter build apk --debug --target-platform android-arm64
